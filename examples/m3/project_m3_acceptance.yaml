# M3 acceptance: 3 tracks through stage_local and real calibration (CASA 6.6.6-18 / pipeline 2025.1.0.37) to
# AWAITING_REVIEW, two at a time, with the disk gate holding the third. All three read the same IC10 D SDM
# (each track's path is its own link to it), so this exercises the machinery, not data diversity.
# Run it from a snapshot of the repo so later edits cannot touch workers that start during the ~11 h run:
#   git worktree add <snapshot> <commit>; bash <snapshot>/scripts/submit_controller.sh <snapshot>/examples/m3/project_m3_acceptance.yaml
project:
  name: m3acc
  root: /arc/projects/VVINGS/vla-calib-mwe/runs/m3acc
  session_prefix: tm

inputs: {source: arc_path}

pipeline:
  image: images.canfar.net/casa-6/casa:6.6.1-17-pipeline    # OS and xvfb-run only; CASA is casa_home
  repo: /arc/home/ekoch/vla_processing/ReductionPipeline
  source_configs: /arc/projects/VVINGS/vla-calib-mwe/config/ic10/pipeline
  casa_home: /arc/home/ekoch/casa-6.6.6-18-pipeline-2025.1.0.37-py3.10.el8
  qa_deps: /arc/projects/VVINGS/shared/qadeps/casa-6.6.6-18-py3.10
  sdm_mode: link
  stage_worker: {cmd: python3}
  disk_factor: 8.0
  resources: {default: {cores: 8, ram: 64}}

qa: {products_dir: products, group: null}

review: {enabled: true}

controller:
  image: images.canfar.net/skaha/base-notebook:latest
  poll_s: 300
  grace_s: 900
  auto_retry: 0
  relaunch_after_d: 0.25          # 6 h: the handoff happens while calibrations run
  max_workers: {calibrate: 2, stage: 2}
  quota_tb: 0.3                   # ~133 GB per active track: the third waits for a slot's worth of disk
  min_free_tb: 0

retention: {science_dir: science}

tracks:
  - {eb: m3acc-1, config: D, path: /arc/projects/VVINGS/vla-calib-mwe/runs/m3-inputs/acc1/20A-346.sb42440562.eb42455346.59786.372811249996}
  - {eb: m3acc-2, config: D, path: /arc/projects/VVINGS/vla-calib-mwe/runs/m3-inputs/acc2/20A-346.sb42440562.eb42455346.59786.372811249996}
  - {eb: m3acc-3, config: D, path: /arc/projects/VVINGS/vla-calib-mwe/runs/m3-inputs/acc3/20A-346.sb42440562.eb42455346.59786.372811249996}
