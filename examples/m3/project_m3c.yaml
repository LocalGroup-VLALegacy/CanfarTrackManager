# M3 real-scheduler check C: stop the controller while a stage worker and a calibrate worker finish,
# leave it stopped for over an hour (finished session records are kept only ~1 h), then relaunch: both
# attempts must be verified from the files the workers left (manifest.json, result.json, run.json, logs).
#   bash scripts/submit_controller.sh examples/m3/project_m3c.yaml
project:
  name: m3c
  root: /arc/projects/VVINGS/vla-calib-mwe/runs/m3c
  session_prefix: tm

inputs: {source: arc_path}

pipeline:
  image: images.canfar.net/skaha/base-notebook:latest
  repo: /arc/home/ekoch/vla_processing/ReductionPipeline
  source_configs: /arc/projects/VVINGS/vla-calib-mwe/config/ic10/pipeline
  worker: {cmd: python3, args: trackmanager/worker.py}
  stage_worker: {cmd: python3}
  resources: {default: {cores: null, ram: null}}

review: {enabled: false}

controller:
  image: images.canfar.net/skaha/base-notebook:latest
  poll_s: 60
  grace_s: 600
  auto_retry: 0
  max_workers: {calibrate: 2, stage: 2}

tracks:
  - {eb: m3c-stage, path: /arc/projects/VVINGS/ic10_d_testcase/test_track/20A-346.sb42440562.eb42455346.59786.372811249996, stage_sleep_s: 120, mode: ok, sleep_s: 1}
  - {eb: m3c-calib, mode: ok, sleep_s: 150}
