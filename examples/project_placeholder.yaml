# Placeholder workers on the real scheduler (no CASA): exercises submission, retry and review plumbing.
project: {name: placeholder, root: /arc/projects/VVINGS/vla-calib-mwe/runs/placeholder}
pipeline:
  image: images.canfar.net/skaha/base-notebook:latest
  resources: {default: {cores: null, ram: null}}
  worker: {cmd: python3, args: trackmanager/worker.py}
controller: {image: images.canfar.net/skaha/base-notebook:latest, poll_s: 60, grace_s: 600, auto_retry: 1,
             max_workers: {calibrate: 4}}
review: {enabled: false}
tracks:
  - {eb: ok-a, mode: ok, sleep_s: 180}
  - {eb: ok-b, mode: ok, sleep_s: 600}
  - {eb: flaky, mode: fail_first, sleep_s: 120}
  - {eb: bad, mode: fail, sleep_s: 60}
