# Real-scheduler queue test (Q1): 4 placeholder tracks, at most 2 workers at once.
project: {name: q1, root: /arc/projects/VVINGS/vla-calib-mwe/runs/q1}
pipeline:
  image: images.canfar.net/skaha/base-notebook:latest
  resources: {default: {cores: null, ram: null}}
  worker: {cmd: python3, args: trackmanager/worker.py}   # relative paths are taken from the repo
controller: {image: images.canfar.net/skaha/base-notebook:latest, poll_s: 60, grace_s: 600, auto_retry: 1,
             max_workers: {calibrate: 2}}
review: {enabled: false}
tracks:
  - {eb: q-a, mode: ok, sleep_s: 240}
  - {eb: q-b, mode: ok, sleep_s: 240}
  - {eb: q-c, mode: ok, sleep_s: 120}
  - {eb: q-d, mode: ok, sleep_s: 120}
