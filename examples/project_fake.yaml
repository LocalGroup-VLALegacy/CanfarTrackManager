# Placeholder workers on the local fake backend (no CANFAR needed):
#   python -m trackmanager.controller --project examples/project_fake.yaml --root /tmp/tm-fake --backend fake
project: {name: fake, root: /tmp/tm-fake}
pipeline:
  image: local
  resources: {default: {cores: null, ram: null}}
  worker: {cmd: python3, args: trackmanager/worker.py}
controller: {image: local, poll_s: 3, grace_s: 20, auto_retry: 1, max_workers: {calibrate: 3}}
review: {enabled: false}
tracks:
  - {eb: ok-a, mode: ok, sleep_s: 4}
  - {eb: ok-b, mode: ok, sleep_s: 8}
  - {eb: flaky, mode: fail_first, sleep_s: 4}
  - {eb: bad, mode: fail, sleep_s: 2}
  - {eb: noresult, mode: no_result, sleep_s: 2}
